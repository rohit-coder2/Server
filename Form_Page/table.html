    const deleteData = async (id) => {
        try {
            fetch(`http://localhost:2000/contact/${id}`,

         console.log(`error`)

    const findData = () => {
        fetch(`http://localhost:2000/contact/`)

            .then(data => {
                console.log(data);

                data.user.forEach(el => {
                    const row = document.createElement("tr");

                    row.innerHTML = `

                        <td style="border: 2px solid black;">${el.email}</td>
                        <td style="border: 2px solid black;">${el.password}</td>
                        <td style="border: 2px solid black;">
                            <button onclick='update_one("${el._id}")'>Edit</button>
                            <button onclick='deleteData("${el._id}")'>Delete</button>
                        </td>
                    `;
