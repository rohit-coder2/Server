const deleteData = (id) => {

    const findData = () => {

                        <td style="border: 2px solid black;">${el.password}</td>

                            <button onclick='updateData("${el._id}")'>Edit</button>
                            <button onclick='deleteData("${el._id}")'>Delete</button>
                        </td>
                    `;
                    table.appendChild(row);
