<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #btn-1{
        background-color: transparent;
        border: 1px solid black;
        border-radius: 4px;
        color: black;
        font-weight: bolder;
        padding: 10px;
        display: flex;
    }
    
    #btn-1:hover{
        background-color: black;
        border: 1px solid white;
        border-radius: 4px;
        color: white;
        font-weight: bolder;
        transition: 0.5s;
        padding: 10px;
    }

    #btn-1>a{
        text-decoration: none;
        color: black;
    }

    #btn-1>a:hover{
        text-decoration: none;
        color: white;
    }

    .con2{
        margin-top: 20px;
        display: flex;
        gap: 20px;
    }

    #delete{
        background-color: transparent;
        border: 1px solid black;
        border-radius: 4px;
        color: black;
        font-weight: bolder;
        padding: 5px;
        display: flex;
    }

    #edit{
        background-color: transparent;
        border: 1px solid black;
        border-radius: 4px;
        color: black;
        font-weight: bolder;
        padding: 5px;
        display: flex;
    }
    #edit:hover{
        background-color: black;
        border: 1px solid white;
        border-radius: 4px;
        color: white;
        font-weight: bolder;
        padding: 5px;
        display: flex;
        transition: .5s;
    }
    #delete:hover{
        background-color: black;
        border: 1px solid white;
        border-radius: 4px;
        color: white;
        font-weight: bolder;
        padding: 5px;
        display: flex;
        transition: .5s;
    }

    #div{
        display: flex;
        gap: 20px;
        margin: 2px;
    }
</style>
<body>
    <table style="border: 2px solid black;" id="root">
        <tr>
            <td style="border: 2px solid black;"> <b>Name</b></td>
            <td style="border: 2px solid black;"> <b>Email</b></td>
            <td style="border: 2px solid black;"><b>Password</b></td>
            <td style="border: 2px solid black;"><b>ID</b></td>
            <td style="border: 2px solid black;"><b>active</b></td>
            <td style="border: 2px solid black;"><b>Edit</b></td>
        </tr>
    </table>
    <div class="con2">

        <div>
            <button type="button" id="btn-1"><a href="update.html">Update</a></button>
        </div>
        <div>
            <button type="button" id="btn-1"><a href="Form.html">Add more</a></button>
        </div>
    </div>

    <script>

const deleteData = (id) => {
    try {
        fetch(`http://localhost:2000/contact/${id}`,{
            method: 'DELETE',
        }   
        )
        window.location.reload();
    } catch (error) {
        console.log("error")
    }
}

    const findData = () => {
        fetch(`http://localhost:2000/contact/`)
        .then(res => res.json())
            .then(data => {
                console.log(data);
                const table = document.getElementById("root");

                data.user.forEach(el => {
                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td style="border: 2px solid black;">${el.name}</td>
                        <td style="border: 2px solid black;">${el.email}</td>
                        <td style="border: 2px solid black;">${el.password}</td>
                        <td style="border: 2px solid black;">${el._id}</td>
                        <td style="border: 2px solid black;">${el.active}</td>
                        <td style="border: 2px solid black;">
                            <div id="div">
                                <button id="edit" onclick='updateData("${el._id}")'>Edit</button>
                                <button id="delete" onclick='deleteData("${el._id}")'>Delete</button>
                                </div>
                        </td>
                    `;
                    table.appendChild(row);
                });
            })
            .catch(err => {
                console.log(err);
            });
    }
    const editData = (id) => {
        alert("Edit functionality not implemented yet. ID: " + id);
    };

    findData();
    </script>
</body>
</html>
